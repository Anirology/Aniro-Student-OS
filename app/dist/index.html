<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F7F8EE">
  <meta name="description" content="Aniro is a calm, private student life assistant for study, deadlines, money, and daily capture.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./fullstack.css">
  <title>Aniro — Your day, in one place</title>
</head>
<body>
  <div class="shell">
    <aside class="sidebar" aria-label="Main navigation">
      <div class="brand"><span class="brand-mark">a<span class="brand-dot">.</span></span><div><strong>Aniro</strong><small>STUDENT LIFE OS</small></div></div>
      <div class="side-label">WORKSPACE</div>
      <nav id="desktop-nav" class="nav-list"></nav>
      <div class="side-bottom"><span class="status-dot"></span><span id="save-status">Saved to Aniro database</span></div>
    </aside>
    <div class="main-column">
      <header class="topbar"><div class="top-left"><button class="menu-button icon-button" id="menu-button" aria-label="Open navigation">☰</button><span id="breadcrumb">Today</span><span class="top-divider">/</span><span id="today-date"></span></div><div class="top-actions"><span id="offline-badge" class="offline-badge" hidden>Offline</span><button class="icon-button" id="quick-capture" title="Quick capture" aria-label="Quick capture">✦</button><div class="avatar" aria-label="Personal workspace">A</div></div></header>
      <main id="app" tabindex="-1"></main>
    </div>
  </div>
  <nav id="mobile-nav" class="mobile-nav" aria-label="Mobile navigation"></nav>
  <div id="toast" role="status" aria-live="polite"></div>
  <dialog id="modal"><form method="dialog" class="modal-shell"><button class="modal-close icon-button" value="cancel" aria-label="Close dialog">×</button><div id="modal-content"></div></form></dialog>
  <input id="import-file" type="file" accept="application/json,.json" hidden>
  <script src="./app.js" type="module"></script>
</body>
</html>
